name: smartflow

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartflow}
      POSTGRES_USER: ${POSTGRES_USER:-smartflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smartflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartflow} -d ${POSTGRES_DB:-smartflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartflow}
      SECRET_KEY: ${SECRET_KEY}
      SUPERADMIN_DOCUMENTO: ${SUPERADMIN_DOCUMENTO}
      SUPERADMIN_SENHA: ${SUPERADMIN_SENHA}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend:/usr/share/nginx/html:ro
    depends_on:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: production_public
      traefik.http.routers.smartflow.rule: Host(`flow.osmardev.online`)
      traefik.http.routers.smartflow.entrypoints: websecure
      traefik.http.routers.smartflow.tls.certresolver: letsencrypt
      traefik.http.services.smartflow.loadbalancer.server.port: "80"
    networks:
      - internal
      - public

networks:
  internal:
  public:
    external: true
    name: production_public

volumes:
  smartflow_pgdata:
