services:
  db:
    image: postgres:15-alpine
    container_name: nfc_db
    restart: always
    environment:
      POSTGRES_DB: plaquinhas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plaquinhas"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nfc_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/plaquinhas
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - SUPERADMIN_DOCUMENTO=${SUPERADMIN_DOCUMENTO:-}
      - SUPERADMIN_SENHA=${SUPERADMIN_SENHA:-}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nfc_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - web

volumes:
  pgdata:
